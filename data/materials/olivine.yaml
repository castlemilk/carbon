id: olivine
name: "Olivine (forsterite-rich ultramafic rock)"
class: MINERAL
summary: >
  Fast-weathering magnesium silicate (Mg2SiO4) crushed and spread on croplands
  or coasts for enhanced weathering. Dissolution consumes CO2 and releases Mg2+
  that ultimately exports alkalinity to the ocean as bicarbonate; also supplies
  plant nutrients and can ameliorate soil pH. Grinding and spreading dominate
  cost and embodied emissions; weathering rates in soils depend on grain size,
  climate, and soil chemistry.
