id: selexol-solvent
name: "Selexol (dimethyl ethers of polyethylene glycol)"
class: LIQUID_SOLVENT
summary: >
  Physical solvent that dissolves CO2 without chemical reaction, regenerated by
  pressure reduction with minimal heat input. Standard choice for pre-combustion
  capture of high-CO2-pressure syngas from gasification or for natural-gas
  sweetening; the low partial pressure of post-combustion flue gas makes it
  uneconomic there.
