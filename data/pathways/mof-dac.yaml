id: mof-dac
name: "MOF-based DAC (diamine-Mg2(dobpdc) class)"
setting: DAC
trl: 5
search_terms: ["diamine-appended Mg2(dobpdc) direct air capture", "step isotherm MOF temperature vacuum swing adsorption", "mmen-Mg2(dobpdc) cooperative CO2 adsorption"]
mechanism: |
  Diamine-appended Mg2(dobpdc) metal-organic frameworks capture CO2 via
  cooperative insertion into metal-bound diamines, forming ammonium-carbamate
  chains. This yields a step-shaped isotherm: near-full working capacity at
  ~400 ppm (ambient air) and a sharp release step at modest heating, enabling
  temperature-vacuum-swing adsorption (TVSA) with low-temperature steam rather
  than deep vacuum or high-grade heat. Sorbent films are coated onto structured
  contactors to keep pressure drop low.
metrics:
  cost:
    low: 80
    high: 600
    unit: USD/tCO2
    year_basis: 2023
    source_ref: young2023
  energy_thermal:
    low: 4.5
    high: 7.5
    unit: GJ/tCO2
    year_basis: 2016
    source_ref: sanzperez2016
advantages:
  - "Step-shaped isotherm gives near-full capacity from ambient-air CO2 levels and sharp regeneration"
  - "TVSA can run on low-quality steam or waste heat; process models project competitive energy use vs liquid-solvent DAC"
challenges:
  - "Humid-air degradation and diamine volatilization cut sorbent lifetime"
  - "MOF synthesis cost and scale-up of structured contactors"
material_ids: [mg2dobpdc]
source_refs: [mcqueen2021, young2023, sinha2017, mcdonald2012, darunte2017]
mermaid_sequence_source: |
  sequenceDiagram
      participant Air as Ambient air
      participant Cont as Structured MOF contactor
      participant MOF as Diamine-Mg₂(dobpdc)
      participant Steam as Low-grade steam
      participant Vacuum as Mild vacuum
      participant Store as Storage
      Air->>Cont: Pass dilute air through coated contactor
      MOF->>MOF: Cooperative CO₂ insertion at ~400 ppm
      Cont->>Steam: Isolate saturated contactor
      Steam->>MOF: Cross sharp release step at modest heat
      Vacuum->>MOF: Pull concentrated CO₂ product
      MOF-->>Cont: Return regenerated sorbent to service
      Vacuum->>Store: Compress and store CO₂
mermaid_source: |
  flowchart LR
      classDef stream fill:#f6f6f9,stroke:#16161a,color:#16161a
      classDef equip fill:#1a1a23,stroke:#16161a,color:#ffffff
      classDef sorb fill:#ffffff,stroke:#5eead4,color:#16161a,stroke-width:2px
      classDef co2 fill:#7c5cff,stroke:#16161a,color:#ffffff,stroke-width:2px
      classDef seq fill:#00e0b8,stroke:#16161a,color:#16161a,stroke-width:2px
      classDef heat fill:#ff7a59,stroke:#16161a,color:#ffffff
      classDef air fill:#bae6fd,stroke:#0284c7,color:#16161a

      AIR["Ambient air<br/>~420 ppm"]:::air
      CONT[/"Structured<br/>contactor<br/>(MOF-coated<br/>lamellae)"/]:::equip
      MOF[("Diamine-appended<br/>Mg₂(dobpdc)<br/>step isotherm")]:::sorb
      ADS[/"Adsorption<br/>40-60 °C<br/>CO₂ cooperative<br/>insertion →<br/>ammonium-<br/>carbamate chains"/]:::equip
      REG[/"TVSA regeneration<br/>~120 °C steam<br/>+ mild vacuum"/]:::equip
      STEAM["Low-temperature<br/>steam / waste heat<br/>4.5-7.5 GJ/tCO₂"]:::heat
      PUMP[/"Vacuum pump +<br/>compression"/]:::equip
      CO2{{"Pure CO₂"}}:::seq

      AIR -->|"low ΔP"| CONT
      CONT --> ADS
      ADS <-->|"full capacity<br/>at 400 ppm"| MOF
      ADS -->|"CO₂-lean air"| WASTE(["to atmosphere"])
      MOF -->|"sharp release<br/>step"| REG
      REG -->|"regenerated MOF"| MOF
      STEAM -.-> REG
      REG -->|"CO₂ (dry)"| PUMP
      PUMP --> CO2
      CO2 -->|"dense-phase"| SEQ(("Geological<br/>storage"))
