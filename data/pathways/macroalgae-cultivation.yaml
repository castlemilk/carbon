id: macroalgae-cultivation
name: Macroalgae cultivation and sinking
setting: BIOLOGICAL
trl: 4
search_terms:
  - macroalgae cultivation carbon sequestration
  - seaweed farming blue carbon
  - kelp sinking CO2 removal
mechanism: |
  Farmed seaweed fixes CO2 rapidly (global wild seaweed communities take up
  ~1.5 PgC/yr in production); climate benefit accrues only if farmed biomass
  carbon is buried in sediments or exported to the deep sea rather than
  decomposing on the shelf. Duarte et al. (2017) put today's aquaculture
  sequestration upper limit at ~2.5 MtCO2/yr (~0.4% of the ~0.63 GtCO2/yr
  sequestered by wild seaweeds), with removal intensity of roughly
  1,500 tCO2/km2/yr.

  NASEM (2022) assesses purposeful seaweed cultivation/sequestration as having
  medium-confidence scalability above 0.1 and below 1.0 GtCO2/yr at global
  scale - contingent on farms covering ~73,000 km2 (a square 270 km on a side,
  or 63% of global coastline as a 100 m belt) for just 0.1 Gt/yr - with
  durability of deep-sea export still unproven. Deliberate deep-water sinking
  remains undemonstrated.
metrics:
  capacity_potential:
    low: 0.1
    high: 1
    unit: Gt/yr
    year_basis: 2022
    source_ref: nas2022
advantages:
  - No freshwater, fertilizer, or land footprint; established aquaculture industry
  - "Co-products: food, feed (methane-reducing additives), biofuels"
challenges:
  - Fate of exported carbon largely unverified - most decomposes before deep burial
  - Climate-relevant scale needs millions of hectares of offshore farming
  - Nutrient and light competition; offshore engineering for rough seas
source_refs:
  - duarte2017
  - nas2022
mermaid_sequence_source: |
  sequenceDiagram
      participant Atmos as Atmosphere
      participant Farm as Offshore seaweed farm
      participant Harvest as Harvest operation
      participant Shelf as Continental shelf
      participant Deep as Deep sea / sediments
      Atmos->>Farm: Supply CO₂ through air-sea equilibrium
      Farm->>Farm: Fix carbon into growing macroalgae
      Farm->>Harvest: Harvest mature biomass
      Harvest->>Shelf: Route non-sequestered fraction
      Shelf-->>Atmos: Decompose and return carbon to cycle
      Harvest->>Deep: Export selected biomass to deep water
      Deep-->>Deep: Bury carbon if export remains durable
mermaid_source: |
  flowchart LR
      classDef stream fill:#f6f6f9,stroke:#16161a,color:#16161a
      classDef equip fill:#1a1a23,stroke:#16161a,color:#ffffff
      classDef bio fill:#a3e635,stroke:#16161a,color:#16161a
      classDef ocean fill:#67e8f9,stroke:#16161a,color:#16161a
      classDef seq fill:#00e0b8,stroke:#16161a,color:#16161a,stroke-width:2px
      classDef waste fill:#94a3b8,stroke:#16161a,color:#ffffff

      DIC["Seawater DIC<br/>(dissolved CO₂ /<br/>HCO₃⁻)"]:::ocean
      ATM["Atmospheric<br/>CO₂"]:::stream
      FARM[/"Offshore macroalgae<br/>farm (kelp lines<br/>~1,500 tCO₂/km²/yr)"/]:::bio
      HARV["Harvested<br/>seaweed biomass"]:::bio
      SINK[/"Deliberate sinking<br/>(deep-water export<br/>— undemonstrated)"/]:::equip
      SHELF[/"Decomposition on<br/>continental shelf<br/>(C returns to cycle)"/]:::waste
      DEEP["Deep sea /<br/>sediment burial"]:::ocean
      SEQ{{"Buried biomass C<br/>(durability<br/>unproven)"}}:::seq
      CO["Co-products:<br/>food, feed, biofuel<br/>(asparagopsis →<br/>methane cut)"]:::bio
      RISK["Most exported C<br/>decomposes before<br/>deep burial<br/>(verification gap)"]:::waste

      ATM -.->|"air-sea<br/>equilibration"| DIC
      DIC -->|"rapid photosynthesis<br/>(wild ~1.5 PgC/yr) "| FARM
      FARM -->|"harvest"| HARV
      HARV -->|"climate-relevant<br/>fraction"| SINK
      HARV -->|"majority"| CO
      SINK --> DEEP
      SINK -.->|"large fraction<br/>breaks down"| SHELF
      SHELF -.-> RISK
      DEEP -->|"if recalcitrant"| SEQ
