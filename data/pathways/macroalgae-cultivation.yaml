      classDef equip fill:#1a1a23,stroke:#16161a,color:#ffffff
      classDef bio fill:#a3e635,stroke:#16161a,color:#16161a
      classDef ocean fill:#67e8f9,stroke:#16161a,color:#16161a
      classDef seq fill:#00e0b8,stroke:#16161a,color:#16161a,stroke-width:2px
      classDef waste fill:#94a3b8,stroke:#16161a,color:#ffffff

      DIC["Seawater DIC<br/>(dissolved CO₂ /<br/>HCO₃⁻)"]:::ocean
      ATM["Atmospheric<br/>CO₂"]:::stream
      FARM[/"Offshore macroalgae<br/>farm (kelp lines<br/>~1,500 tCO₂/km²/yr)"/]:::bio
      HARV["Harvested<br/>seaweed biomass"]:::bio
      SINK[/"Deliberate sinking<br/>(deep-water export<br/>— undemonstrated)"/]:::equip
      SHELF[/"Decomposition on<br/>continental shelf<br/>(C returns to cycle)"/]:::waste
      DEEP["Deep sea /<br/>sediment burial"]:::ocean
      SEQ{{"Buried biomass C<br/>(durability<br/>unproven)"}}:::seq
      CO["Co-products:<br/>food, feed, biofuel<br/>(asparagopsis →<br/>methane cut)"]:::bio
      RISK["Most exported C<br/>decomposes before<br/>deep burial<br/>(verification gap)"]:::waste

      ATM -.->|"air-sea<br/>equilibration"| DIC
      DIC -->|"rapid photosynthesis<br/>(wild ~1.5 PgC/yr) "| FARM
      FARM -->|"harvest"| HARV
      HARV -->|"climate-relevant<br/>fraction"| SINK
      HARV -->|"majority"| CO
      SINK --> DEEP
      SINK -.->|"large fraction<br/>breaks down"| SHELF
      SHELF -.-> RISK
      DEEP -->|"if recalcitrant"| SEQ
