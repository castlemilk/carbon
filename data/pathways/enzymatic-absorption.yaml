id: enzymatic-absorption
name: Enzymatic CO2 absorption (carbonic anhydrase)
setting: BIOLOGICAL
trl: 4
search_terms:
  - carbonic anhydrase carbon capture
  - enzyme accelerated CO2 absorption
  - biomimetic post-combustion capture
mechanism: |
  Carbonic anhydrase (CA) catalyses CO2 + H2O <-> HCO3- + H+ with turnover up
  to ~10^6 s-1, roughly a million-fold acceleration over the uncatalysed
  hydration. Immobilized thermostable CAs speed absorber kinetics in water or
  amino-acid-salt solvents, allowing smaller absorbers and lower-temperature
  regeneration (~60-90 C) than amine scrubbing. CA can also accelerate
  mineralization of captured CO2 as CaCO3.

  Pilot-scale techno-economics exist: CO2 Solutions' enzyme-carbonate process
  was advanced to large-bench scale with EERC testing and a conservative
  full-scale estimate of roughly $39/tCO2 on coal flue gas including
  compression (vs ~$70/t for conventional amine capture in the same study);
  Akermin's biocatalyst-delivery TEA reported $53/tCO2 captured and $66/tCO2
  avoided against a $66/t MEA baseline. The cost range here deliberately
  reflects the more conservative peer-reviewed TEA, widened modestly for
  early-stage uncertainty; the vendor-side $39 figure sits below it.
metrics:
  cost:
    low: 50
    high: 70
    unit: USD/tCO2
    year_basis: 2014
    source_ref: reardon2014
advantages:
  - High selectivity and fast kinetics under mild, non-corrosive conditions
  - Regeneration at lower temperature than amine solvents, cutting heat demand
  - Projected 20-30% capture-cost savings vs amine benchmarks in published TEAs
challenges:
  - Enzyme thermal and pH stability in hot alkaline process streams
  - Immobilization lifetime and enzyme production cost
  - No commercial-scale demonstration; cost estimates are pre-pilot projections
material_ids:
  - carbonic-anhydrase
source_refs:
  - talekar2022
  - reardon2014
  - csi2017
mermaid_sequence_source: |
  sequenceDiagram
      participant Flue as Flue gas
      participant Abs as Absorber
      participant Enzyme as Immobilized carbonic anhydrase
      participant Solvent as Aqueous solvent
      participant Regen as Regenerator
      participant Store as Storage
      Flue->>Abs: Contact dilute CO₂ with solvent
      Enzyme->>Solvent: Accelerate CO₂ + H₂O ⇌ HCO₃⁻ + H⁺
      Solvent->>Regen: Transfer loaded bicarbonate
      Regen->>Solvent: Release CO₂ at 60-90 °C
      Solvent-->>Abs: Return regenerated solvent
      Regen->>Store: Compress recovered CO₂
mermaid_source: |
  flowchart LR
      classDef stream fill:#f6f6f9,stroke:#16161a,color:#16161a
      classDef equip fill:#1a1a23,stroke:#16161a,color:#ffffff
      classDef bio fill:#a3e635,stroke:#16161a,color:#16161a
      classDef sorb fill:#ffffff,stroke:#93c5fd,color:#16161a,stroke-width:2px
      classDef co2 fill:#7c5cff,stroke:#16161a,color:#ffffff,stroke-width:2px
      classDef seq fill:#00e0b8,stroke:#16161a,color:#16161a,stroke-width:2px
      classDef heat fill:#ff7a59,stroke:#16161a,color:#ffffff

      FLUE["Flue gas<br/>(coal / NG /<br/>industrial)"]:::stream
      ABS[/"Absorber column<br/>40-60 °C<br/>(smaller than<br/>amine units)"/]:::equip
      SOLV[("Aqueous carbonate /<br/>amino-acid-salt<br/>solvent (benign)")]:::sorb
      ENZ[("Immobilized<br/>carbonic anhydrase<br/>(thermostable)<br/>turnover ~10⁶ s⁻¹")]:::bio
      REG[/"Low-temperature<br/>regeneration<br/>60-90 °C"/]:::equip
      CO2{{"Pure CO₂<br/>(sequestered)"}}:::seq
      MIN[/"Mineralization<br/>route: enzyme →<br/>CaCO₃ precipitation"/]:::equip
      SEQ2{{"CaCO₃ solid<br/>(alternative<br/>storage)"}}:::seq

      FLUE -->|"CO₂ 4-14%"| ABS
      ABS <-->|"CO₂ + H₂O ⇌ HCO₃⁻ + H⁺<br/>(10⁶× faster<br/>than uncatalysed)"| SOLV
      ENZ -.->|"biocatalyst<br/>immobilized in<br/>contactor"| ABS
      ABS -->|"CO₂-lean<br/>flue gas"| WASTE(["to stack"])
      SOLV -->|"loaded<br/>bicarbonate"| REG
      REG -->|"gentle heating<br/>reverses equilibrium"| CO2
      CO2 -->|"dense-phase"| SEQ(("Geological<br/>storage"))
      CO2 -.->|"alternative route"| MIN
      MIN --> SEQ2
