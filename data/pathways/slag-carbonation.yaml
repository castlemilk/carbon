id: slag-carbonation
name: "Industrial residue carbonation (slag and ash)"
setting: MINERALIZATION
trl: 6
search_terms: ["steel slag carbonation CO2", "industrial alkaline waste mineralization", "ex-situ mineral carbonation residues"]
mechanism: |
  Alkaline industrial residues - steel slag, fly ash, cement kiln dust, mine
  tailings - contain Ca/Mg oxides and silicates that react with CO2 to form
  stable carbonate minerals, either ex-situ in reactors or passively in stockpiles.
  Renforth (2019) estimates global alkaline-material production (~7 Gt/yr) could
  sequester 2.9-8.5 GtCO2 per year by 2100 across all residues, with slags and
  ashes the highest-reactivity fraction. Products can substitute aggregates or
  precipitated carbonate fillers.
metrics:
  capacity_potential:
    low: 2.9
    high: 8.5
    unit: Gt/yr
    year_basis: 2019
    source_ref: renforth2019
  permanence:
    low: 10000
    high: 100000
    unit: years
    year_basis: 2019
    source_ref: renforth2019
advantages:
  - "Uses existing waste streams - no mining burden; potential product revenue"
  - "Carbonates are thermodynamically stable on geological timescales"
challenges:
  - "Residue supply is finite and geographically fixed; not scalable beyond ~Gt/yr"
  - "Trace-metal leaching during processing; slow intrinsic reaction rates"
source_refs: [renforth2019]
mermaid_sequence_source: |
  sequenceDiagram
      participant Industry as Steel, cement, or mining plant
      participant Residue as Alkaline residue stream
      participant Prep as Comminution and preparation
      participant Reactor as Carbonation reactor
      participant CO2 as Captured CO₂ source
      participant Product as Carbonate product
      Industry->>Residue: Collect slag, ash, or tailings
      Residue->>Prep: Crush and expose reactive minerals
      Prep->>Reactor: Feed fine residue and water
      CO2->>Reactor: Supply concentrated CO₂
      Reactor->>Reactor: React Ca/Mg oxides and silicates
      Reactor->>Product: Form stable carbonate aggregate or filler
      Product-->>Industry: Substitute virgin construction material
mermaid_source: |
  flowchart LR
      classDef stream fill:#f6f6f9,stroke:#16161a,color:#16161a
      classDef equip fill:#1a1a23,stroke:#16161a,color:#ffffff
      classDef geol fill:#fcd34d,stroke:#16161a,color:#16161a
      classDef seq fill:#00e0b8,stroke:#16161a,color:#16161a,stroke-width:2px
      classDef waste fill:#94a3b8,stroke:#16161a,color:#ffffff

      SLAG["Alkaline residues:<br/>steel slag, fly ash,<br/>cement kiln dust,<br/>mine tailings<br/>(~7 Gt/yr global)"]:::waste
      PREP[/"Comminution<br/>(milling to<br/>increase surface)"/]:::equip
      RXN[/"Ex-situ reactor<br/>Ca/Mg silicate + CO₂<br/>→ CaCO₃/MgCO₃<br/>50-200 °C<br/>optimized water"/]:::geol
      PASS[/"Passive stockpile<br/>carbonation<br/>(atmospheric<br/>CO₂, slow)"/]:::geol
      CO2IN["CO₂ source<br/>(captured flue gas<br/>or DAC)"]:::stream
      SEQ{{"Carbonate<br/>minerals<br/>>10 kyr"}}:::seq
      PROD["Products:<br/>aggregates,<br/>precipitated CaCO₃<br/>fillers (revenue)"]:::stream
      LEACH["Trace-metal<br/>leaching<br/>management"]:::waste

      SLAG -->|"residue<br/>stream"| PREP
      PREP -->|"fine feed"| RXN
      PREP -->|"coarse fraction"| PASS
      CO2IN -->|"concentrated<br/>CO₂"| RXN
      ATM["Atmospheric CO₂"]:::stream
      ATM -.-> PASS
      RXN -->|"carbonated<br/>product"| SEQ
      PASS -->|"slowly<br/>carbonated"| SEQ
      RXN -.->|"water + metals"| LEACH
      SEQ -.->|"product<br/>substitution"| PROD
