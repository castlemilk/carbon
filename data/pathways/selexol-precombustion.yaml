id: selexol-precombustion
name: "Physical solvent pre-combustion (Selexol)"
setting: POINT_SOURCE
trl: 9
search_terms: ["Selexol pre-combustion CO2 capture", "physical solvent gasification syngas", "IGCC carbon capture"]
mechanism: |
  Fuel is gasified and shifted so the syngas is mostly H2 and CO2 at high
  pressure (~20-70 bar). Selexol (dimethyl ethers of polyethylene glycol)
  physically absorbs CO2 at high partial pressure without chemical reaction and
  is regenerated by pressure letdown flashes, releasing CO2 with minimal heat
  input. The hydrogen-rich fuel is then burned or used in fuel cells. Standard
  commercial technology in gas sweetening and ammonia plants.
metrics:
  cost:
    low: 15
    high: 40
    unit: USD/tCO2
    year_basis: 2021
    source_ref: iea2022ccus
advantages:
  - "Lowest capture cost per tonne among power-sector options (high partial pressure, no reboiler duty)"
  - "Commercial physical-solvent hardware with decades of operating experience"
challenges:
  - "Only applies to gasification/shift flowsheets; not retrofit to conventional boilers"
  - "Deep chilling or refrigeration needed for cold-solvent operation"
material_ids: [selexol-solvent]
source_refs: [iea2022ccus]
