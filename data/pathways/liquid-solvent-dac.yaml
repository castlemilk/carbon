id: liquid-solvent-dac
name: "Liquid solvent DAC (tropical KOH loop)"
setting: DAC
trl: 8
search_terms: ["liquid solvent direct air capture", "KOH causticization DAC", "calcium pellet reactor air contactor"]
mechanism: |
  Atmospheric CO2 is absorbed into ~1 M KOH in large thin-film air contactors,
  forming K2CO3. The carbonate is causticized with Ca(OH)2 to precipitate
  CaCO3 pellets, which are calcined at ~900 C in an oxy-fired kiln, releasing a
  pure CO2 stream and regenerating lime and KOH in closed loops. Built on
  cooling-tower-style contactor hardware: 1PointFive's Stratos (Permian Basin,
  Carbon Engineering design) is the largest single DAC facility to date,
  designed for up to ~500 kt/yr once fully operational - like all plants built
  so far (e.g. Climeworks Mammoth, ~36 kt/yr nameplate) still sub-megatonne.
  Megatonne-scale capture remains a stated 2030s goal, not operating reality.
metrics:
  cost:
    low: 94
    high: 232
    unit: USD/tCO2
    year_basis: 2018
    source_ref: keith2018
  energy_thermal:
    low: 5.0
    high: 9.0
    unit: GJ/tCO2
    year_basis: 2018
    source_ref: keith2018
  energy_electric:
    low: 1.0
    high: 2.0
    unit: GJ-e/tCO2
    year_basis: 2018
    source_ref: keith2018
advantages:
  - "Air contactor uses off-the-shelf cooling-tower components; scalable to Mt/yr"
  - "High-temperature calciner delivers pipeline-ready pure CO2"
challenges:
  - "Large natural-gas (or electrified) heat demand drives cost and siting"
  - "Causticization solids handling at extreme scale; water evaporation losses"
source_refs: [keith2018, young2023, fasihi2019]
mermaid_sequence_source: |
  sequenceDiagram
      participant Air as Ambient air
      participant Cont as KOH air contactor
      participant Caust as Causticizer
      participant Kiln as Oxy-fired calciner
      participant Lime as Lime and KOH loops
      participant Store as Storage
      Air->>Cont: Supply high-volume air
      Cont->>Lime: Convert KOH and CO₂ to K₂CO₃
      Lime->>Caust: Send carbonate solution and Ca(OH)₂
      Caust->>Kiln: Form and filter CaCO₃ pellets
      Kiln->>Store: Calcine pellets and compress pure CO₂
      Kiln-->>Lime: Return CaO for slaking and KOH loop
      Store-->>Air: Permanently remove atmospheric CO₂
mermaid_source: |
  flowchart LR
      classDef stream fill:#f6f6f9,stroke:#16161a,color:#16161a
      classDef equip fill:#1a1a23,stroke:#16161a,color:#ffffff
      classDef sorb fill:#ffffff,stroke:#5eead4,color:#16161a,stroke-width:2px
      classDef co2 fill:#7c5cff,stroke:#16161a,color:#ffffff,stroke-width:2px
      classDef seq fill:#00e0b8,stroke:#16161a,color:#16161a,stroke-width:2px
      classDef heat fill:#ff7a59,stroke:#16161a,color:#ffffff
      classDef air fill:#bae6fd,stroke:#0284c7,color:#16161a
      classDef solid fill:#fde68a,stroke:#16161a,color:#16161a

      AIR["Ambient air<br/>~420 ppm CO₂"]:::air
      CONT[/"Air contactor<br/>(cooling-tower-style<br/>thin-film packing)"/]:::equip
      KOH[("~1 M KOH<br/>aqueous<br/>loop A")]:::sorb
      CAUST[/"Causticizer<br/>(pellet reactor)<br/>~70 °C"/]:::equip
      CAOH[("Ca(OH)₂<br/>slurry<br/>(slake lime)")]:::solid
      PELL["CaCO₃ pellets<br/>(filter cake)"]:::solid
      CALC[/"Calciner<br/>oxy-fired<br/>~900 °C"/]:::equip
      ASU[/"Air separation<br/>(O₂ fuel)"/]:::air
      COOL[/"CO₂ cooler +<br/>compressor"/]:::equip
      CO2{{"Pure CO₂<br/>(sequestered)"}}:::seq
      LIME[("CaO<br/>(regenerated lime)<br/>→ slaker")]:::solid

      AIR -->|"forced-draft<br/>fan"| CONT
      CONT <-->|"CO₂ + 2KOH → K₂CO₃<br/>+ H₂O"| KOH
      CONT -->|"CO₂-lean air"| WASTE(["to atmosphere"])
      KOH -->|"K₂CO₃<br/>solution"| CAUST
      CAOH --> CAUST
      CAUST --> PELL
      PELL -->|"calciner feed"| CALC
      ASU -.->|"O₂ fuel"| CALC
      CALC -->|"high-purity CO₂"| COOL
      COOL --> CO2
      CO2 -->|"dense-phase"| SEQ(("Geological<br/>storage /<br/>sequestration"))
      CALC -->|"regenerated CaO"| LIME
      LIME -->|"slake to<br/>Ca(OH)₂"| CAOH
      KOH -.->|"regenerated<br/>KOH loop"| CONT
