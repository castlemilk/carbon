id: liquid-solvent-dac
name: "Liquid solvent DAC (tropical KOH loop)"
setting: DAC
trl: 8
search_terms: ["liquid solvent direct air capture", "KOH causticization DAC", "calcium pellet reactor air contactor"]
mechanism: |
  Atmospheric CO2 is absorbed into ~1 M KOH in large thin-film air contactors,
  forming K2CO3. The carbonate is causticized with Ca(OH)2 to precipitate
  CaCO3 pellets, which are calcined at ~900 C in an oxy-fired kiln, releasing a
  pure CO2 stream and regenerating lime and KOH in closed loops. First
  megatonne-scale plants (Climeworks Mammoth is solid; this design is Carbon
  Engineering's, now 1PointFive) built on cooling-tower contactor hardware.
