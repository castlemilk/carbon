      AIR["Atmospheric air"]:::air
      ASU[/"Cryogenic<br/>air separation<br/>(ASU)"/]:::air
      FUEL["Fuel<br/>(coal / NG / biomass)"]:::fuel
      BOILER[/"Oxy-fired boiler<br/>(recycled CO₂<br/>for T control)"/]:::equip
      HRSG[/"Heat recovery<br/>(steam cycle)"/]:::heat
      COOL[/"Recycle cooler +<br/>water knockout"/]:::equip
      PUR[/"CO₂ compression<br/>+ purification"/]:::equip
      CO2{{"Pure CO₂<br/>>95% vol"}}:::seq
