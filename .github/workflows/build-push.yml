# Builds and pushes the container image on every push to master.
# GHA runners are linux/amd64 — native builds, no QEMU (VKE nodes are amd64).
name: build-push

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium for Mermaid validation
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Validate seed corpus
        run: ./node_modules/.bin/tsx src/lib/seed/check.ts data

      - name: Validate Mermaid sources
        run: node scripts/check-mermaid.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_EMBED_PARENT_ORIGIN=https://benebsworth.com
          tags: |
            ghcr.io/castlemilk/carbon:latest
            ghcr.io/castlemilk/carbon:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
