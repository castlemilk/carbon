# Builds and pushes the container image on every push to master.
# GHA runners are linux/amd64 — native builds, no QEMU (VKE nodes are amd64).
name: build-push

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/castlemilk/carbon:latest
            ghcr.io/castlemilk/carbon:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
