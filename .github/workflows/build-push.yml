# Verify PRs and gate image publication on the documented commit checks.
# GHA runners are linux/amd64 — native builds, no QEMU (VKE nodes are amd64).
name: build-push

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.52.0'
          checksum: '02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd'

      - name: Install Chromium for Mermaid validation
        run: |
          npx --no-install puppeteer browsers install chrome-headless-shell
          echo "PUPPETEER_EXECUTABLE_PATH=$(node --input-type=module -e 'import puppeteer from "puppeteer"; process.stdout.write(await puppeteer.executablePath({headless: "shell"}))')" >> "$GITHUB_ENV"

      - name: Verify application
        env:
          MERMAID_PUPPETEER_CONFIG: ${{ runner.temp }}/mermaid-puppeteer.json
        run: |
          printf '%s\n' '{"args":["--no-sandbox"]}' > "$MERMAID_PUPPETEER_CONFIG"
          task verify

  build-push:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_EMBED_PARENT_ORIGIN=https://benebsworth.com
          tags: |
            ghcr.io/castlemilk/carbon:latest
            ghcr.io/castlemilk/carbon:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
