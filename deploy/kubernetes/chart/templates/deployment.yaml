apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-carbon-stable
  labels:
    app.kubernetes.io/name: carbon
    app.kubernetes.io/instance: {{ .Release.Name }}
    track: stable
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate   # RWO PVC: only one pod may mount /data at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: carbon
      app.kubernetes.io/instance: {{ .Release.Name }}
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carbon
        app.kubernetes.io/instance: {{ .Release.Name }}
        track: stable
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: CARBON_DB
              value: /data/carbon.db
          {{- with .Values.resources }}
          resources:
            requests:
              cpu: {{ .requests.cpu }}
              memory: {{ .requests.memory }}
            limits:
              cpu: {{ .limits.cpu }}
              memory: {{ .limits.memory }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
