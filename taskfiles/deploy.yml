# carbon — deploys
#
# Target: the omega VKE cluster (Vultr Kubernetes Engine), managed by Paprika —
# same pattern as cuttlefish/telesis/brandbrain/flaggr. Paprika watches this
# repo's chart (deploy/kubernetes/chart, path of the Application CR) and
# canary-promotes rendered releases in namespace paprika-e2e.
#
#   code change  → merge to master → GHA builds ghcr.io/castlemilk/carbon:latest
#   first deploy → task deploy:cr   (apply the Application CR once)
#   image update → task deploy:restart  (bump running pods to :latest)
version: '3'

vars:
  KUBECONFIG_PATH: ~/projects/paprika/omega-oidc.kubeconfig
  IMAGE: ghcr.io/castlemilk/carbon
  NAMESPACE: paprika-e2e
  RELEASE_PREFIX: carbon-release

tasks:
  image:
    desc: Build + push linux/amd64 image locally (ttl.sh fallback; GHA does ghcr)
    summary: |
      Local emergency path when you can't wait for GHA. VKE nodes are amd64 and
      this Mac is arm64 — the --platform flag is NOT optional (QEMU emulated).

      ttl.sh is anonymous + ephemeral: tag IS the retention (4h here). If you
      use it, override the chart's image.repository/tag via the Application CR
      stage parameters or a values bump, then revert once GHA catches up.
    cmds:
      - task: ':check:node'
      - task: ':data:check'
      - docker buildx build --platform linux/amd64 --build-arg NEXT_PUBLIC_EMBED_PARENT_ORIGIN=https://benebsworth.com -t {{.IMAGE}}:local -t ttl.sh/carbon-amd64:4h --push .
      - echo "pushed ttl.sh/carbon-amd64:4h (expires) and {{.IMAGE}}:local"

  cr:
    desc: Apply/update the Paprika Application CR on omega (one-time bootstrap)
    summary: |
      Creates Application `carbon` in ns {{.NAMESPACE}}. Paprika then polls
      github.com/castlemilk/carbon @ master every 60s and renders
      deploy/kubernetes/chart autonomously — after this, chart changes deploy
      themselves.
    preconditions:
      - sh: test -f {{printf "%s" .KUBECONFIG_PATH | expandenv}}
        msg: "kubeconfig not found at {{.KUBECONFIG_PATH}}"
    cmds:
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl apply -f deploy/kubernetes/application.yaml
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl get application carbon -n {{.NAMESPACE}}

  status:
    desc: Rollout + pods + HTTPRoute state on omega
    cmds:
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl get application carbon -n {{.NAMESPACE}}
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl get deploy,pods,svc,pvc,httproute -l app.kubernetes.io/name=carbon -n {{.NAMESPACE}}

  restart:
    desc: Bump running pods to :latest (image-only updates)
    summary: |
      Paprika re-renders on CHART changes; a new :latest image alone doesn't
      move the rollout. This annotates the pod template to force a rolling
      recreate. (Deployment uses Recreate strategy because of the RWO PVC.)
    preconditions:
      - sh: KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl get deployment/{{.RELEASE_PREFIX}}-carbon-stable -n {{.NAMESPACE}}
        msg: "canonical Carbon deployment {{.RELEASE_PREFIX}}-carbon-stable was not found"
    cmds:
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl annotate deployment/{{.RELEASE_PREFIX}}-carbon-stable -n {{.NAMESPACE}} kubectl.kubernetes.io/restartedAt="$(date -u +%FT%TZ)" --overwrite
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl rollout status deployment/{{.RELEASE_PREFIX}}-carbon-stable -n {{.NAMESPACE}} --timeout=180s

  logs:
    desc: Tail app logs from the cluster
    cmds:
      - KUBECONFIG={{printf "%s" .KUBECONFIG_PATH | expandenv}} kubectl logs -l app.kubernetes.io/name=carbon -n {{.NAMESPACE}} -f --tail=100

  health:
    desc: Hit /api/health through the public hostname
    cmds:
      - tmp="$$(mktemp)"; trap 'rm -f "$$tmp"' EXIT; curl --fail --show-error --silent https://carbon.benebsworth.com/api/health >"$$tmp"; node -e 'const fs = require("node:fs"); const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (body.status !== "ok" || body.components?.database?.status !== "healthy") process.exit(1); console.log(JSON.stringify(body))' "$$tmp"

  # ---- legacy target kept for reference -------------------------------------
  vercel-auth:
    desc: (legacy) whoami against Vercel
    cmds:
      - "{{.BIN}}/vercel whoami"
